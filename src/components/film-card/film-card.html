<div class="card" (click)="open()">
  <img class="poster" [src]="data().posterUrl" alt="Poster">
  <app-icon [svg]="icon" [class]="iconStatus()" class="icon" (click)="toggleFavorite($event)"></app-icon>
  <div class="shadow">
    <div class="data-wrapper">
      <div class="title">{{ data().title }}</div>
      <div class="info">{{ data().year }}</div>
      <div class="info">{{ data().genre }}</div>
      <div class="info">{{ data().rating }} / 10</div>
    </div>
  </div>
</div>
