@for (option of options(); track option.id) {
  <label [for]="option.id" class="section">
    <input
      type="radio"
      name="section"
      [value]="option.id"
      [checked]="selected() === option.id"
      [id]="option.id"
      class="input"
    >
    <app-icon class="icon" [svg]="option.icon"></app-icon>
    {{ option.label }}
  </label>
}
